<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>お団子キャッチ！ - 10秒間の和風ミニゲーム</title>
    <meta name="description" content="10秒間で降ってくるお団子をキャッチ！ケーキは減点！スマホブラウザで遊べる無料ミニゲームです。">

    <style>
        :root {
            --bg-color: #F4F1EA;
            --text-color: #333333;
            --accent-color: #B7282E;
            --ui-bg: rgba(244, 241, 234, 0.95);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #d4dcb9;
            touch-action: none;
            font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
            color: var(--text-color);
        }

        #game-container {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            max-width: 600px;
            background: linear-gradient(to bottom, #e8ecd6, #d4dcb9);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--ui-bg);
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-shadow: 2px 2px 0px #fff;
        }

        p.rules {
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: bold;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 30px;
            box-shadow: 0 4px 0 #7a181d;
            cursor: pointer;
            font-family: inherit;
            margin: 10px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #7a181d;
        }

        .share-btn {
            background-color: #1DA1F2;
            box-shadow: 0 4px 0 #0c85d0;
        }

        .share-btn:active {
            box-shadow: 0 0 0 #0c85d0;
        }

        .name-field {
            width: min(82vw, 360px);
            margin: 6px 0 8px;
            padding: 13px 16px;
            border: 2px solid #b8c59b;
            border-radius: 14px;
            background: #fffdf7;
            color: var(--text-color);
            font: inherit;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
        }

        .screen-note {
            min-height: 1.4em;
            margin: 0 16px 4px;
            color: #7a181d;
            font-size: 0.9rem;
            text-align: center;
        }

        .screen-link {
            display: inline-block;
            margin: 5px 8px;
            color: #7a181d;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .result-content {
            width: min(92vw, 460px);
            max-height: 100%;
            overflow-y: auto;
            padding: 22px 0 30px;
            text-align: center;
        }

        .share-text {
            display: block;
            width: min(88vw, 420px);
            min-height: 72px;
            margin: 8px auto 4px;
            padding: 10px;
            border: 1px solid #b8c59b;
            border-radius: 10px;
            background: #fffdf7;
            color: var(--text-color);
            font: 0.9rem/1.45 inherit;
            box-sizing: border-box;
            resize: vertical;
        }

        .ranking {
            width: min(88vw, 420px);
            margin: 16px auto 8px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.65);
            text-align: left;
        }

        .ranking h3 {
            margin: 0 0 8px;
            color: var(--accent-color);
            font-size: 1.1rem;
            text-align: center;
        }

        .ranking ol {
            margin: 0;
            padding-left: 1.6rem;
        }

        .ranking li {
            padding: 4px 0;
            border-bottom: 1px solid rgba(122, 24, 29, 0.12);
        }

        .ranking-status {
            margin: 8px 0 0;
            color: #635d54;
            font-size: 0.82rem;
            text-align: center;
        }

        #center-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="center-text"></div>

    <div id="home-screen" class="screen">
        <h1>お団子キャッチ</h1>
        <p class="rules">約10秒間で「お団子🍡(+1)」をキャッチ！<br>「ケーキ🍰(-3)」は避けてね！<br>（画面を左右にスワイプして操作）</p>
        <label for="player-name">ランキング表示名</label>
        <input id="player-name" class="name-field" type="text" maxlength="20" autocomplete="nickname" placeholder="名前を入力してください">
        <p id="name-note" class="screen-note" role="status" aria-live="polite"></p>
        <button id="start-btn">いざ、開始</button>
        <button id="home-share-btn" class="share-btn" type="button">ゲームをシェア</button>
        <p id="home-share-status" class="screen-note" role="status" aria-live="polite"></p>
        <a class="screen-link" href="https://chameleonjp-lab.github.io/chameleonjp_lab/" target="_blank" rel="noopener noreferrer">カメレオンJPの実験場へ</a>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="result-content">
            <h2 style="font-size: 2rem; margin-bottom: 10px;">結果発表</h2>
            <p style="font-size: 1.5rem; margin-bottom: 12px;">
                得点: <span style="font-size: 3.5rem; color: var(--accent-color); font-weight: bold;" id="final-score">0</span>
            </p>
            <p id="result-player" class="ranking-status"></p>
            <textarea id="share-text" class="share-text" readonly aria-label="結果のシェア文"></textarea>
            <button id="retry-btn">もう一度挑む</button>
            <button id="share-btn" class="share-btn">結果をシェア（文面をコピー）</button>
            <p id="share-status" class="screen-note" role="status" aria-live="polite"></p>
            <section class="ranking" aria-labelledby="ranking-title">
                <h3 id="ranking-title">スコアランキング TOP10</h3>
                <ol id="ranking-list"><li>ランキングを読み込み中…</li></ol>
                <p id="ranking-status" class="ranking-status" role="status" aria-live="polite"></p>
            </section>
            <a class="screen-link" href="https://chameleonjp-lab.github.io/chameleonjp_lab/" target="_blank" rel="noopener noreferrer">カメレオンJPの実験場へ</a>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const homeScreen = document.getElementById('home-screen');
    const resultScreen = document.getElementById('result-screen');
    const centerText = document.getElementById('center-text');
    const scoreDisplay = document.getElementById('final-score');
    const container = document.getElementById('game-container');
    const nameInput = document.getElementById('player-name');
    const nameNote = document.getElementById('name-note');
    const resultPlayer = document.getElementById('result-player');
    const shareTextField = document.getElementById('share-text');
    const shareStatus = document.getElementById('share-status');
    const rankingList = document.getElementById('ranking-list');
    const rankingStatus = document.getElementById('ranking-status');
    const homeShareStatus = document.getElementById('home-share-status');

    const GAME_SLUG = 'test';
    const LAB_URL = 'https://chameleonjp-lab.github.io/chameleonjp_lab/';
    const SUPABASE_URL = 'https://mlpnjgezrnhdxsxolyzj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_drzcy0v97knU6FgjqSgBHw_0A9XPdFM';
    const CLIENT_VERSION = 'test-2026-08-31-platform';
    const NAME_STORAGE_KEY = 'dango-catch.player-name';
    let playerName = localStorage.getItem(NAME_STORAGE_KEY) || '';
    nameInput.value = playerName;

    function normalizeName(value) {
        return value.replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 20);
    }

    function requireName() {
        playerName = normalizeName(nameInput.value);
        nameInput.value = playerName;
        if (!playerName) {
            nameNote.textContent = '名前を入力してから開始してください。';
            nameInput.focus();
            return false;
        }
        localStorage.setItem(NAME_STORAGE_KEY, playerName);
        nameNote.textContent = '';
        return true;
    }

    function gameUrl() {
        return new URL(location.href).toString().split('#')[0];
    }

    function resultShareText() {
        return `${playerName}さんのお団子キャッチ結果：${score}点！🍡\nケーキ🍰を避けながら10秒間で挑戦しました。\nあなたも挑戦してみてね！\n${gameUrl()}\n#お団子キャッチ #ミニゲーム`;
    }

    function homeShareText() {
        return `10秒間のお団子キャッチに挑戦しよう！🍡\nお団子は+1点、ケーキは-3点。\n${gameUrl()}\n#お団子キャッチ #ミニゲーム`;
    }

    async function shareOrCopy(text, title) {
        const statusElement = resultScreen.classList.contains('hidden') ? homeShareStatus : shareStatus;
        statusElement.textContent = '';
        if (navigator.share) {
            try {
                await navigator.share({ title, text, url: gameUrl() });
                statusElement.textContent = '共有しました。';
                return;
            } catch (error) {
                if (error && error.name === 'AbortError') return;
            }
        }
        try {
            await navigator.clipboard.writeText(text);
            statusElement.textContent = 'シェア文をコピーしました。';
        } catch (_) {
            shareTextField.focus();
            shareTextField.select();
            statusElement.textContent = 'シェア文を選択しました。コピーしてご利用ください。';
        }
    }

    async function callRankingRpc(functionName, payload) {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
            method: 'POST',
            headers: {
                apikey: SUPABASE_PUBLISHABLE_KEY,
                Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
        });
        const body = await response.text();
        let data = null;
        try { data = body ? JSON.parse(body) : null; } catch (_) { data = body; }
        if (!response.ok) throw new Error(`${functionName}: ${response.status}`);
        return data;
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function renderRanking(rows) {
        const list = Array.isArray(rows) ? rows.slice(0, 10) : [];
        rankingList.innerHTML = list.length
            ? list.map((row) => `<li>${escapeHtml(row.display_name || row.player_name || 'ななし')}：${Number(row.score ?? row.best_score ?? 0)}点</li>`).join('')
            : '<li>まだランキングがありません。</li>';
    }

    async function submitAndLoadRanking() {
        rankingStatus.textContent = 'ランキングを更新中…';
        try {
            await callRankingRpc('submit_score', {
                p_display_name: playerName,
                p_game_slug: GAME_SLUG,
                p_score: Math.trunc(score),
                p_client_version: CLIENT_VERSION,
            });
        } catch (_) {
            rankingStatus.textContent = '今回のスコアを送信できませんでした。ランキングを表示します。';
        }
        try {
            const rows = await callRankingRpc('get_best_score_ranking', { p_game_slug: GAME_SLUG, p_limit: 10 });
            renderRanking(rows);
            if (!rankingStatus.textContent) rankingStatus.textContent = '上位10名を表示しています。';
        } catch (_) {
            renderRanking([]);
            rankingStatus.textContent = 'ランキングを読み込めませんでした。';
        }
    }

    let logicalWidth, logicalHeight;
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
        container.style.height = window.innerHeight + 'px';
        logicalWidth = container.clientWidth;
        logicalHeight = window.innerHeight;
        
        canvas.width = logicalWidth * dpr;
        canvas.height = logicalHeight * dpr;
        ctx.scale(dpr, dpr);
        
        catcher.baseY = logicalHeight - 100;
        catcher.y = catcher.baseY;
    }
    window.addEventListener('resize', resizeCanvas);

    let gameState = 'home'; 
    let score = 0;
    let items = [];
    let effects = [];
    let spawnQueue = [];
    let gameTimer = 0;
    let nextSpawnTime = 0;
    let lastTimestamp = 0;
    let animationId = null;
    let countdownIntervalId = null;
    
    const GAME_DURATION = 10000;
    const DANGO_EMOJI = '🍡';
    const CAKE_EMOJI = '🍰';

    const catcher = {
        width: 110,
        height: 20,
        x: 0,
        y: 0, 
        baseY: 0,
        yOffset: 0,
        color: '#4A3B32'
    };

    resizeCanvas();
    catcher.x = logicalWidth / 2 - catcher.width / 2;

    let lastTouchX = null;

    canvas.addEventListener('touchstart', (e) => {
        if (gameState !== 'playing' && gameState !== 'waiting_for_fall') return;
        lastTouchX = e.touches[0].clientX;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (gameState !== 'playing' && gameState !== 'waiting_for_fall') return;
        e.preventDefault(); 
        
        const currentTouchX = e.touches[0].clientX;
        if (lastTouchX !== null) {
            catcher.x += (currentTouchX - lastTouchX);
            if (catcher.x < 0) catcher.x = 0;
            if (catcher.x + catcher.width > logicalWidth) catcher.x = logicalWidth - catcher.width;
        }
        lastTouchX = currentTouchX;
    }, { passive: false });

    canvas.addEventListener('touchend', () => { lastTouchX = null; });

    // 50個の団子と10個のケーキをキューに詰めてシャッフル
    function initSpawnQueue() {
        spawnQueue = [];
        for (let i = 0; i < 50; i++) spawnQueue.push('dango');
        for (let i = 0; i < 10; i++) spawnQueue.push('cake');
        
        for (let i = spawnQueue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [spawnQueue[i], spawnQueue[j]] = [spawnQueue[j], spawnQueue[i]];
        }
    }

    function spawnItem() {
        if (spawnQueue.length === 0) return;
        const type = spawnQueue.pop(); 
        
        items.push({
            type: type,
            x: Math.random() * (logicalWidth - 40) + 20,
            y: -40,
            speedY: Math.random() * 2.5 + 5,
            size: 35,
            active: true
        });
    }

    function update(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = timestamp - lastTimestamp;
        lastTimestamp = timestamp;
        const timeScale = dt / 16.66; // スマホのFPS差異を吸収

        ctx.clearRect(0, 0, logicalWidth, logicalHeight);

        if (gameState === 'playing' || gameState === 'waiting_for_fall') {
            gameTimer += dt;
        }

        // 上部のタイムゲージ描画
        const timeRate = Math.min(gameTimer / GAME_DURATION, 1);
        ctx.fillStyle = gameTimer > GAME_DURATION - 3000 ? 'rgba(183, 40, 46, 0.6)' : 'rgba(92, 126, 68, 0.5)';
        ctx.fillRect(0, 0, logicalWidth * (1 - timeRate), 6);

        // お皿のバウンドと描画
        if (catcher.yOffset > 0) catcher.yOffset -= 1 * timeScale;
        if (catcher.yOffset < 0) catcher.yOffset = 0;
        catcher.y = catcher.baseY + catcher.yOffset;

        ctx.fillStyle = catcher.color;
        ctx.beginPath();
        ctx.roundRect(catcher.x, catcher.y, catcher.width, catcher.height, 10);
        ctx.fill();

        // スコア表示
        ctx.fillStyle = '#333';
        ctx.font = 'bold 24px "Yu Mincho", serif';
        ctx.textAlign = 'left';
        ctx.fillText(`得点: ${score}`, 20, 35);

        // アイテムの落下ロジックと当たり判定
        ctx.font = '35px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let activeItemsCount = 0;

        for (let i = 0; i < items.length; i++) {
            let d = items[i];
            if (!d.active) continue;
            activeItemsCount++;

            d.y += d.speedY * timeScale;
            
            const emoji = d.type === 'dango' ? DANGO_EMOJI : CAKE_EMOJI;
            ctx.fillText(emoji, d.x, d.y);

            const hitboxMargin = 15;
            if (d.y + d.size/2 >= catcher.y && d.y - d.size/2 <= catcher.y + catcher.height) {
                if (d.x >= catcher.x - hitboxMargin && d.x <= catcher.x + catcher.width + hitboxMargin) {
                    
                    d.active = false;
                    catcher.yOffset = 8;
                    
                    if (d.type === 'dango') {
                        score++;
                        effects.push({ x: d.x, y: catcher.y - 20, life: 1.0, text: '+1', color: '183, 40, 46' });
                    } else if (d.type === 'cake') {
                        score -= 3;
                        effects.push({ x: d.x, y: catcher.y - 20, life: 1.0, text: '-3', color: '30, 58, 138' });
                    }
                }
            }
            // 画面下部に消えたら無効化
            if (d.y > logicalHeight + 50) d.active = false;
        }

        // 点数エフェクト処理
        ctx.font = 'bold 24px Arial';
        for (let i = effects.length - 1; i >= 0; i--) {
            let e = effects[i];
            e.y -= 2 * timeScale;
            e.life -= 0.04 * timeScale;
            
            ctx.fillStyle = `rgba(${e.color}, ${Math.max(e.life, 0)})`;
            ctx.fillText(e.text, e.x, e.y);
            
            if (e.life <= 0) effects.splice(i, 1);
        }

        // --- 進行ロジックの修正部分 ---
        if (gameState === 'playing') {
            // 8.5秒間 (8500ms) の間に60個のアイテムを等間隔で確実に生成
            while (gameTimer >= nextSpawnTime && spawnQueue.length > 0) {
                spawnItem();
                nextSpawnTime += (8500 / 60); // 約141ms間隔
            }

            // キューが空になったら生成ストップ（まだ終了の文字は出さない）
            if (spawnQueue.length === 0) {
                gameState = 'waiting_for_fall';
            }
        } else if (gameState === 'waiting_for_fall' && activeItemsCount === 0) {
            // 画面上からすべてのアイテム（団子・ケーキ）が完全に消えて初めて「終了！」
            gameState = 'finished';
            centerText.innerText = "終了！";
            centerText.style.opacity = 1;
            
            // 1.5秒後にリザルトへ
            setTimeout(endGame, 1500);
        }

        if (gameState !== 'result') {
            animationId = requestAnimationFrame(update);
        }
    }

    function startGameSequence() {
        if (!requireName()) return;
        if (animationId) cancelAnimationFrame(animationId);
        if (countdownIntervalId) clearInterval(countdownIntervalId);

        homeScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        
        score = 0;
        items = [];
        effects = [];
        gameTimer = 0;
        nextSpawnTime = 0;
        lastTimestamp = 0;
        
        resizeCanvas();
        catcher.x = logicalWidth / 2 - catcher.width / 2;
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);

        initSpawnQueue();

        centerText.style.opacity = 1;
        let count = 3;
        centerText.innerText = count;
        
        countdownIntervalId = setInterval(() => {
            count--;
            if (count > 0) {
                centerText.innerText = count;
            } else if (count === 0) {
                centerText.innerText = "開始！";
            } else {
                clearInterval(countdownIntervalId);
                centerText.style.opacity = 0;
                startPlay();
            }
        }, 1000);
    }

    function startPlay() {
        gameState = 'playing';
        lastTimestamp = performance.now();
        gameTimer = 0;
        nextSpawnTime = 0;
        animationId = requestAnimationFrame(update);
    }

    function endGame() {
        gameState = 'result';
        centerText.style.opacity = 0;
        scoreDisplay.innerText = score;
        resultPlayer.textContent = `${playerName}さんの結果`;
        shareTextField.value = resultShareText();
        rankingList.innerHTML = '<li>ランキングを読み込み中…</li>';
        rankingStatus.textContent = '';
        resultScreen.classList.remove('hidden');
        void submitAndLoadRanking();
    }

    document.getElementById('start-btn').addEventListener('click', startGameSequence);
    document.getElementById('retry-btn').addEventListener('click', startGameSequence);
    document.getElementById('home-share-btn').addEventListener('click', () => shareOrCopy(homeShareText(), 'お団子キャッチ'));
    document.getElementById('share-btn').addEventListener('click', () => shareOrCopy(resultShareText(), 'お団子キャッチの結果'));
    nameInput.addEventListener('input', () => { nameNote.textContent = ''; });

</script>
</body>
</html>
